# Сборка desktop-версий (Windows .exe и Linux) на бесплатных раннерах GitHub.
#
# Запуск:
#   * вручную: вкладка Actions → «Build desktop» → Run workflow;
#   * по тегу:  git tag v1.2.0 && git push origin v1.2.0
#     (тогда ещё и публикуется GitHub Release с готовыми архивами).
#
# Репозиторий должен быть публичным — для публичных репозиториев
# раннеры GitHub бесплатны.
name: Build desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # нужно только для публикации релиза

env:
  # Версия Flutter — как у тебя локально (flutter --version).
  FLUTTER_VERSION: '3.47.7'
  APP_NAME: lyric

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release --flavor prod

      - name: Pack
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $name = "${{ env.APP_NAME }}-$tag-windows-x64"
          Compress-Archive -Path "build/windows/x64/prod/runner/Release/*" -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: '*.zip'
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libjsoncpp-dev \
            libwebkit2gtk-4.1-dev libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release --flavor prod

      - name: Pack
        run: |
          name="${{ env.APP_NAME }}-${{ github.ref_name }}-linux-x64"
          tar -czf "$name.tar.gz" -C build/linux/x64/prod/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: '*.tar.gz'
          if-no-files-found: error

  release:
    # Только для тегов v*; при ручном запуске артефакты просто лежат в Actions.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true