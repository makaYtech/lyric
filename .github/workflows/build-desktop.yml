# Сборка desktop-версий: Windows (установщик .exe) и Linux (AppImage).
#
# Запуск:
#   * вручную: вкладка Actions → «Build desktop» → Run workflow;
#   * по тегу:  git tag v1.2.0 && git push origin v1.2.0
#     (тогда ещё и публикуется GitHub Release с готовыми файлами).
name: Build desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write # нужно только для публикации релиза

env:
  FLUTTER_VERSION: '3.47.7'
  APP_NAME: lyric

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release --flavor prod

      # Flutter на Windows не умеет собираться в один .exe: рядом обязательно
      # лежат flutter_windows.dll, data/ и плагины. Поэтому упаковываем всё
      # в установщик Inno Setup — пользователю достаются один Setup.exe.
      # Ставится в %LOCALAPPDATA%\Programs без прав администратора.
      - name: Installer (.exe)
        shell: pwsh
        run: |
          $tag  = "${{ github.ref_name }}"
          $ver  = $tag.TrimStart('v')
          $out  = "${{ env.APP_NAME }}-$tag-windows-x64-setup"

          # Папку Release ищем по flutter_windows.dll — путь не зависит от flavor.
          $dll  = Get-ChildItem build/windows -Recurse -Filter flutter_windows.dll | Select-Object -First 1
          $src  = $dll.DirectoryName
          $exe  = (Get-ChildItem $src -Filter *.exe | Select-Object -First 1).Name
          Write-Host "Source: $src, exe: $exe"

          choco install innosetup -y --no-progress

          @'
          [Setup]
          AppId={{6F1D2B7E-3C54-4A9B-8E21-5B7A0C9D4E13}
          AppName=Lyric
          AppVersion={#AppVersion}
          DefaultDirName={autopf}\Lyric
          DefaultGroupName=Lyric
          UninstallDisplayIcon={app}\{#ExeName}
          OutputDir=.
          OutputBaseFilename={#OutName}
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          CloseApplications=yes

          [Languages]
          Name: "russian"; MessagesFile: "compiler:Languages\Russian.isl"

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; Flags: unchecked

          [Files]
          Source: "{#SourceDir}\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion

          [Icons]
          Name: "{autoprograms}\Lyric"; Filename: "{app}\{#ExeName}"
          Name: "{autodesktop}\Lyric"; Filename: "{app}\{#ExeName}"; Tasks: desktopicon

          [Run]
          Filename: "{app}\{#ExeName}"; Description: "{cm:LaunchProgram,Lyric}"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path installer.iss -Encoding utf8

          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$ver" "/DSourceDir=$src" "/DExeName=$exe" "/DOutName=$out" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: '*-setup.exe'
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libjsoncpp-dev \
            libwebkit2gtk-4.1-dev libsqlite3-dev \
            imagemagick

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release --flavor prod

      - name: AppImage
        run: |
          set -euo pipefail
          name="${{ env.APP_NAME }}-${{ github.ref_name }}-linux-x86_64"

          bundle=$(find build/linux -type d -name bundle | head -1)
          exe=$(basename "$(find "$bundle" -maxdepth 1 -type f -perm -u+x | head -1)")
          echo "bundle=$bundle exe=$exe"

          mkdir -p AppDir/usr/bin
          cp -r "$bundle"/. AppDir/usr/bin/

          # Иконка в репозитории — jpg, а AppImage нужен png.
          convert assets/icons/app_icon.jpg -resize 256x256^ -gravity center -extent 256x256 AppDir/lyric.png

          cat > AppDir/lyric.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=Lyric
          Exec=$exe
          Icon=lyric
          Categories=Education;
          Terminal=false
          EOF

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/@EXE@" "$@"
          EOF
          sed -i "s/@EXE@/$exe/" AppDir/AppRun
          chmod +x AppDir/AppRun

          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # Без FUSE на раннере: appimagetool распаковывает себя сам.
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir "$name.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: '*.AppImage'
          if-no-files-found: error

  release:
    # Только для тегов v*; при ручном запуске артефакты просто лежат в Actions.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true